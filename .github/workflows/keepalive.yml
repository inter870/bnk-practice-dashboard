name: Keep Streamlit App Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping public app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://stancedash.streamlit.app/' }}
        run: |
          APP_URL="${APP_URL%/}"
          curl -L --fail --max-time 120 --retry 2 --retry-delay 10 "$APP_URL/"
          curl -L --fail --max-time 30 --retry 1 "$APP_URL/_stcore/health" || true

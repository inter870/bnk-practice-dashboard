name: Apply Codex Deploy Patch

on:
  push:
    branches:
      - main
    paths:
      - patches/deploy_app_py.patch.b64.*
      - .github/workflows/apply-codex-deploy-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-codex-deploy-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply app.py patch
        shell: bash
        run: |
          set -euo pipefail
          if ! ls patches/deploy_app_py.patch.b64.* >/dev/null 2>&1; then
            echo "No deploy patch chunks found."
            exit 0
          fi
          cat patches/deploy_app_py.patch.b64.* | base64 -d > patches/deploy_app_py.patch
          if git apply --check patches/deploy_app_py.patch; then
            git apply patches/deploy_app_py.patch
          else
            echo "Patch does not apply cleanly. It may already be applied."
          fi
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/ui/__init__.py src/ui/korea_os_theme.py
          git commit -m "Apply Codex deploy app patch"
          git push
